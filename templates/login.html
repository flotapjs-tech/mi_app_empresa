<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
}

/* CENTRADO PERFECTO */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* TARJETA */
.login-card {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    text-align: center;
}

/* INPUTS */
.login-card input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box; /* 🔥 CLAVE para que no se corran */
}

/* BOTÓN */
.login-card button {
    width: 100%;
    padding: 10px;
    background: #2c3e50;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.login-card button:hover {
    background: #34495e;
}

/* LOGO */
.logo {
    width: 120px;
    margin-bottom: 10px;
}
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <img src="/static/img/logo.png" class="logo">

            <h2>Iniciar sesión</h2>

            <form method="POST">
                <input type="text" name="usuario" placeholder="Usuario">
                <input type="password" name="password" placeholder="Contraseña">
                <button type="submit">Ingresar</button>
            </form>
        </div>
    </div>
</body>

</html>
