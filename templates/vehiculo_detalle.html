{% extends "layout.html" %}

{% block content %}

<div class="card">
    <h2>Detalle mantenimiento</h2>

    <table>
        <tr>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Monto</th>
        </tr>

    {% for d in detalle %}
        <tr>
            <td>{{ d[0] }}</td>
            <td>{{ d[1] }}</td>
            <td>{{ d[2] }}</td>
        </tr>
    {% endfor %}
    </table>

</div>

{% endblock %}
