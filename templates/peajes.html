{% extends "layout.html" %}

{% block content %}

<h2>Peajes</h2>

<div class="card">

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="archivo"
            accept=".csv"
            required
        >

        <button type="submit">
            Subir CSV
        </button>

    </form>

</div>

<br>

<div class="card">

<table class="tabla">

    <tr>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Patente</th>
        <th>Tarifa</th>
        <th>Turno</th>
        <th>Conductor</th>
    </tr>

    {% for r in registros %}

    <tr>

        <td>{{ r.fecha }}</td>
        <td>{{ r.hora }}</td>
        <td>{{ r.patente }}</td>
        <td>${{ r.tarifa }}</td>
        <td>{{ r.turno }}</td>
        <td>{{ r.conductor or "-" }}</td>

    </tr>

    {% endfor %}

</table>

</div>

{% endblock %}
